import java.security.MessageDigest

plugins {
    id 'java'
    id 'application'
}

group = 'com.aresstack'
// Release-Builds setzen die Version über -PreleaseVersion=<x.y.z> (aus dem Git-Tag).
version = findProperty('releaseVersion') ?: '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Erzwingt Java 21 auch für Ausführungs-Tasks, die die IDE ad-hoc anlegt
// (z.B. IntelliJs "WebServerMain.main()"), statt des Projekt-JDKs.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    applicationName = 'webserver'
    mainClass = 'com.aresstack.webserver.launcher.WebServerMain'
    // Platzhalter wird in den Startskripten durch APP_HOME ersetzt, damit die
    // Anwendung ihr Wurzelverzeichnis unabhängig vom Aufrufort findet.
    applicationDefaultJvmArgs = ['-Dwebserver.root=WEBSERVER_APP_HOME']
}

// Beim Entwicklungsstart über "gradlew run" (und IDE-Ad-hoc-Tasks) ist das
// Projektverzeichnis das Wurzelverzeichnis — der APP_HOME-Platzhalter gilt
// nur für die generierten Startskripte.
tasks.named('run') {
    jvmArgs = ["-Dwebserver.root=${projectDir.absolutePath}"]
}

tasks.named('startScripts') {
    doLast {
        unixScript.text = unixScript.text.replace('WEBSERVER_APP_HOME', '\'"$APP_HOME"\'')
        windowsScript.text = windowsScript.text.replace('WEBSERVER_APP_HOME', '%APP_HOME%')
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.aresstack:anauthentia:0.1.0'
    implementation 'com.aresstack:anauthentia-jwt:0.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def caddyBinaryName = System.getProperty('os.name').toLowerCase().contains('win') ? 'caddy.exe' : 'caddy'

test {
    useJUnitPlatform()
    // Die Caddy-in-the-loop-Integrationstests brauchen das echte Binary —
    // auch in CI, damit sie nicht still übersprungen werden.
    dependsOn 'downloadCaddy'
    // Integrationstests routen über den Host-Header; HttpClient gibt ihn nur
    // mit diesem Property frei.
    systemProperty 'jdk.httpclient.allowRestrictedHeaders', 'host'
    systemProperty 'caddy.binary', new File(projectDir, "runtime/caddy/bin/${caddyBinaryName}").absolutePath
}

// ---------------------------------------------------------------------------
// Caddy binary (pinned version, checksum-verified, official GitHub release)
// ---------------------------------------------------------------------------

ext.caddyVersion = '2.11.4'

def caddyPlatform() {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch').toLowerCase()
    def archPart = (arch == 'aarch64' || arch == 'arm64') ? 'arm64' : 'amd64'
    if (os.contains('win')) return "windows_${archPart}"
    if (os.contains('mac')) return "mac_${archPart}"
    return "linux_${archPart}"
}

// Caddys checksums.txt enthält SHA-512-Hashes.
def sha512(File file) {
    def digest = MessageDigest.getInstance('SHA-512')
    file.withInputStream { input ->
        def buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}

// ---------------------------------------------------------------------------
// Fat JAR: eine einzelne, selbst lauffähige Datei. Enthält alle Java-
// Abhängigkeiten sowie caddy.exe als Ressource, die beim ersten Start nach
// runtime/caddy/bin entpackt wird (CaddyBinaryProvider).
// ---------------------------------------------------------------------------

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a single self-contained runnable jar (app + deps + caddy)'
    dependsOn 'downloadCaddy'
    archiveBaseName = 'aresstack-webserver'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from sourceSets.main.output
    from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    }
    from("runtime/caddy/bin/${caddyBinaryName}") { into 'caddy' }
    from('runtime/caddy/LICENSE') { into 'caddy' }
}

// ---------------------------------------------------------------------------
// Release (Slice 10): aresstack-webserver mit Caddy-Binary und Lizenz.
// Persistent bei Updates: config/, data/, logs/ — austauschbar: bin/, lib/,
// generated/. Die echte webserver.json gehört nie ins Release, nur die
// Beispieldatei; data/, generated/ und logs/ legt die Anwendung beim ersten
// Start selbst an.
// ---------------------------------------------------------------------------

distributions {
    main {
        distributionBaseName = 'aresstack-webserver'
        contents {
            from('runtime/caddy/bin') {
                into 'bin'
            }
            from('runtime/caddy/LICENSE') {
                into 'licenses/caddy'
            }
            from('config/webserver.example.json') {
                into 'config'
            }
        }
    }
}

['distZip', 'distTar', 'installDist'].each { taskName ->
    tasks.named(taskName) { dependsOn 'downloadCaddy' }
}

tasks.register('downloadCaddy') {
    group = 'caddy'
    description = "Downloads and verifies Caddy ${caddyVersion} into runtime/caddy/bin"

    def platform = caddyPlatform()
    def isWindows = platform.startsWith('windows')
    def archiveName = "caddy_${caddyVersion}_${platform}." + (isWindows ? 'zip' : 'tar.gz')
    def baseUrl = "https://github.com/caddyserver/caddy/releases/download/v${caddyVersion}"
    def downloadDir = layout.buildDirectory.dir('caddy-download').get().asFile
    def binDir = file('runtime/caddy/bin')
    def binaryName = isWindows ? 'caddy.exe' : 'caddy'

    outputs.file(new File(binDir, binaryName))
    outputs.file(new File(binDir.parentFile, 'LICENSE'))

    doLast {
        def archive = new File(downloadDir, archiveName)
        def checksums = new File(downloadDir, "caddy_${caddyVersion}_checksums.txt")
        downloadDir.mkdirs()

        if (!archive.exists()) {
            logger.lifecycle("Downloading ${baseUrl}/${archiveName}")
            new URL("${baseUrl}/${archiveName}").withInputStream { i -> archive.withOutputStream { it << i } }
        }
        new URL("${baseUrl}/caddy_${caddyVersion}_checksums.txt").withInputStream { i -> checksums.withOutputStream { it << i } }

        def expectedLine = checksums.readLines().find { it.endsWith(archiveName) }
        if (expectedLine == null) {
            throw new GradleException("No checksum entry for ${archiveName}")
        }
        def expected = expectedLine.split(/\s+/)[0]
        def actual = sha512(archive)
        if (expected != actual) {
            archive.delete()
            throw new GradleException("Checksum mismatch for ${archiveName}: expected ${expected}, got ${actual}")
        }
        logger.lifecycle("Checksum verified: ${actual}")

        binDir.mkdirs()
        def tree = isWindows ? zipTree(archive) : tarTree(resources.gzip(archive))
        // Nur fehlende Dateien extrahieren: die Version ist gepinnt, und das
        // Binary kann von einem laufenden Server gesperrt sein.
        if (!new File(binDir, binaryName).exists()) {
            copy {
                from(tree) { include binaryName }
                into binDir
            }
            if (!isWindows) {
                new File(binDir, binaryName).setExecutable(true)
            }
        }
        if (!new File(binDir.parentFile, 'LICENSE').exists()) {
            copy {
                from(tree) { include 'LICENSE' }
                into binDir.parentFile
            }
        }
        logger.lifecycle("Caddy binary ready: ${new File(binDir, binaryName)}")
    }
}
