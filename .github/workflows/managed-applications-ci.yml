name: Managed applications CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test Java 21
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all tests with the Windows Caddy binary
        run: ./gradlew.bat --no-daemon clean test
      - name: Print failing JUnit XML reports
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem build/test-results/test -Filter "TEST-*.xml" -ErrorAction SilentlyContinue | ForEach-Object {
            $report = Get-Content $_.FullName -Raw
            if ($report -match '<failure') {
              Write-Host "FAILURE REPORT: $($_.Name)"
              Write-Host $report
            }
          }
