name: ChatGPT offline Gradle cache

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/chatgpt-gradle-cache.yml'
      - 'chatgpt-build.sh'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-gradle-cache
  cancel-in-progress: true

jobs:
  cache:
    name: Prepare and verify offline cache
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.chatgpt/gradle-home
      ASSET_NAME: aresstack-webserver-chatgpt-gradle-cache.zip
      RELEASE_TAG: chatgpt-gradle-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve compile, test, and runtime dependencies without building a JAR
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prime-chatgpt-cache.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              def root = gradle.rootProject
              root.tasks.register('primeChatGptDependencies') {
                  group = 'verification'
                  description = 'Resolve all configurations needed by offline project builds.'
                  doLast {
                      root.allprojects.each { subproject ->
                          subproject.configurations.findAll { it.canBeResolved }.each { configuration ->
                              logger.lifecycle("Resolving ${subproject.path}:${configuration.name}")
                              configuration.resolve()
                          }
                      }
                  }
              }
          }
          GRADLE
          bash "$GITHUB_WORKSPACE/gradlew" --no-daemon --refresh-dependencies \
            -I "$RUNNER_TEMP/prime-chatgpt-cache.gradle" primeChatGptDependencies

      - name: Cache the external Linux Caddy test dependency
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/gradlew" --no-daemon downloadCaddy
          test -s runtime/caddy/bin/caddy
          test -s runtime/caddy/LICENSE

      - name: Remove volatile cache state
        shell: bash
        run: |
          set -euo pipefail
          find "$GRADLE_USER_HOME" -type f \( -name '*.lock' -o -name '*.lck' -o -name gc.properties \) -delete
          rm -rf "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/workers" \
            "$GRADLE_USER_HOME/native" "$GRADLE_USER_HOME/caches/journal-1"
          mkdir -p .chatgpt
          cat > .chatgpt/README-offline.md <<'NOTE'
          # AresStack Webserver offline Gradle dependencies

          Extract this ZIP in a fresh checkout of aresstack/webserver, at the repository root.
          This cache targets Linux x86_64 with Java 21 and Gradle 8.14.
          Run `bash chatgpt-build.sh` for an offline clean build with tests.
          Run `bash chatgpt-build.sh test` for tests only.
          This archive includes the verified Linux Caddy test executable because
          the existing Gradle downloadCaddy task otherwise requires network access.
          No AresStack Webserver application JAR or build output is included.
          NOTE
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> .chatgpt/README-offline.md

      - name: Package only the offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r "$ASSET_NAME" \
            .chatgpt/gradle-home \
            .chatgpt/README-offline.md \
            runtime/caddy/bin/caddy \
            runtime/caddy/LICENSE
          test -s "$ASSET_NAME"
          if unzip -Z1 "$ASSET_NAME" | grep -E '(^|/)build/libs/|(^|/)aresstack-webserver-.*\.jar$'; then
            echo 'Unexpected application JAR in cache archive' >&2
            exit 1
          fi
          ls -lh "$ASSET_NAME"

      - name: Verify offline tests from a fresh extraction
        shell: bash
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          git archive "$GITHUB_SHA" | tar -x -C "$verify_dir"
          unzip -q "$ASSET_NAME" -d "$verify_dir"
          cd "$verify_dir"
          chmod -x gradlew
          bash chatgpt-build.sh test

      - name: Save a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: webserver-chatgpt-gradle-cache
          path: ${{ env.ASSET_NAME }}
          compression-level: 0

      - name: Publish rolling release after successful validation
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Offline Gradle 8.14 dependencies for Java 21 (Linux x86_64), plus the verified Linux Caddy test runtime. Source commit: $GITHUB_SHA. Extract in a source checkout and run bash chatgpt-build.sh. No application JAR is packaged."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title 'ChatGPT-compatible offline Gradle cache' \
              --notes "$notes" --prerelease
          else
            gh release edit "$RELEASE_TAG" --notes "$notes"
          fi
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" --clobber
